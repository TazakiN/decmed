[package]
name = "decmed-macaroon-auth"
version = "0.1.0"
edition = "2021"
description = "DecMed Macaroon caveat parsing, verification, and local attenuation"

[dependencies]
chrono = { version = "0.4", features = ["serde"] }
decmed-rme-segment = { path = "../decmed-rme-segment" }
